# AI Setup — External Skill Registry
#
# Third-party skill bundles that ship with their own installer CLI. They are
# registered here rather than vendored into user-dev/skills/ — see
# docs/external-skills.md for why. Format:
#
#   <id> = <requires> :: <probe> :: <install> :: <docs>
#
# - <id>        identifier used by bin/install-external-skills.sh
# - <requires>  command that must be on PATH; absent means skip and print <docs>
# - <probe>     path that exists once installed; drives idempotence. ~ expands
# - <install>   run verbatim; MUST be non-interactive and safe to re-run
# - <docs>      where to read about the provider and how to get <requires>
#
# Adding a provider: append one line here. No script edits are required —
# bin/ reads this registry through lib/common.sh.
#
# Every <install> here has been run end to end. Do not add a line you have not
# executed: an installer that prompts hangs `just setup` on a fresh machine.

android-skills = android :: ~/.claude/skills/android-cli :: android skills add --all :: https://developer.android.com/studio/cli
impeccable     = npx     :: ~/.claude/skills/impeccable  :: npx --yes impeccable@latest install --global --yes :: https://impeccable.style
