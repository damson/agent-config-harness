# What a project of each domain CONTAINS, so the SessionStart hook
# (bin/session-domains.sh) can name its domains wherever the project sits.
# Format, one domain per line:
#
#   <domain> = <signal> ; <signal> ; ...
#   <signal> = <file name glob>            the file exists at the root or one folder below
#            | <file name glob> ~ <ERE>    ...and a line of it matches
#            | ! <either form above>        rules the domain out when it holds
#
# A project can match several domains, and the hook names every one. Keep
# signals specific: a package.json alone says nothing about the stack.

mobile          = build.gradle* ~ com\.android\.(application|library) ; build.gradle* ~ libs\.plugins\.android\.(application|library) ; libs.versions.toml ~ com\.android\.(application|library) ; pubspec.yaml ; package.json ~ "(react-native|expo)"[[:space:]]*:
web-react       = package.json ~ "(react|next)"[[:space:]]*: ; ! package.json ~ "(react-native|expo)"[[:space:]]*:
backend-node    = package.json ~ "(express|fastify|@nestjs/core|koa|hono)"[[:space:]]*:
data-extraction = pyproject.toml ~ (scrapy|playwright|airflow|dagster|prefect) ; requirements*.txt ~ ^(scrapy|playwright|apache-airflow|dagster|prefect)
