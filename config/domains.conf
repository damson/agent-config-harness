# Agent Config Harness — Domain Registry
#
# Each line registers a workspace domain. Format:
#   <domain> = <workspace_subdir>[, <alias>...] : <comma-separated files>
#
# - <domain>           identifier used by detect-domain.sh and scripts
# - <workspace_subdir> path relative to the repo root; the FIRST one is canonical
#                      — the managed files live there and it must exist
# - <alias>...         further folder names the domain answers to when detecting
#                      a project's domain from its path. Detection only: an alias
#                      holds no config and need not exist in this repo.
# - <files>            comma-separated list of config files managed for this domain
#
# `A > B` maps a file named A on the PROJECT side to B inside this repo, for when
# a project calls its file something else.
#
# Adding a new domain: append one line here and create the workspace folder.
# No script edits are required — all tooling reads this through lib/common.sh.
#
# CLAUDE.md is the single source of truth per domain. Each workspace also has an
# AGENTS.md symlink -> CLAUDE.md (so AGENTS.md-reading tools resolve the same
# content). Symlinks are NOT listed here — only the real file is managed/scored.
#
# ── The lines below are EXAMPLES. Replace them with your own domains. ──

mobile          = workspace/mobile          : AGENTS.md>project/CLAUDE.md, CLAUDE.md, .cursorrules
web-react       = workspace/web-react, workspace/web : CLAUDE.md
backend-node    = workspace/backend-node    : CLAUDE.md
data-extraction = workspace/data-extraction : CLAUDE.md

# Personal identity globals (not a dev workspace) — registered so `just eval`
# scores them on the same config-quality rubric.
user-pers       = user-pers                 : custom_instructions.md, user_tone_of_voice.md

# Repo documentation agents read (not a dev workspace) — registered for the same
# reason: prose that steers behaviour should be scored like the rest.
# Named "repo-docs", not "docs": detect_domain matches a domain name as a
# SUBSTRING of any path component, so a bare "docs" would match every project
# with a docs/ directory and make detection ambiguous.
repo-docs       = docs                      : external-skills.md
