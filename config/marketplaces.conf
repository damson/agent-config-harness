# Agent Config Harness — Skill Marketplace Registry
#
# Claude Code marketplaces this setup installs skills from. Registered here
# rather than remembered, so a fresh machine reproduces the same skill set.
#
# Format:
#   <id> = <source> :: <plugins> :: <docs>
#
# - <id>      the MARKETPLACE name, as declared in its marketplace.json `name`
#             field. This is what `plugin@marketplace` addresses, and it is NOT
#             necessarily the repository name — they can differ.
# - <source>  anything `claude plugin marketplace add` accepts: an owner/repo,
#             a git URL, or a local path.
# - <plugins> comma-separated plugin names to install, or `*` for every plugin
#             the marketplace declares.
# - <docs>    where to read about it.
#
# Adding one: append a line. No script edits — bin/marketplaces.sh reads this
# through lib/common.sh.
#
# Note on state: a plugin's installed/not-installed state lives in Claude Code's
# settings.json, not on disk, and the cache directory survives an uninstall. So
# `just marketplaces-status` asks the CLI rather than probing a path — see
# docs/marketplaces.md for why a path probe reports a false positive forever.

# ── The line below is an EXAMPLE. Uncomment it or replace it with your own. ──
#
# fullstack-skills = damson/fullstack-skills :: * :: https://github.com/damson/fullstack-skills
