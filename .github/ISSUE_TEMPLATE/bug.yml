name: Bug report
description: Something misbehaves: a script, a test, the eval, the Action.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        ⚠️ **Exploitable vulnerability?** Don't file it here: this form is
        public. Use *Security → Advisories → Report a vulnerability* instead
        (details in [SECURITY.md](../blob/main/SECURITY.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The commands and the smallest setup that shows it.
  - type: textarea
    id: eval-json
    attributes:
      label: Eval result JSON, if this involves `just eval`
      description: >-
        Anything involving `just eval` is hard to reproduce without your config
        and your API key. Paste the generated JSON from `evals/results/` and
        it becomes tractable. Remember the score moves ±1–2 on borderline runs.
        Redact first: the JSON quotes your config, so strip API keys and
        anything else secret before posting: issues are public.
      render: json
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell, and versions of just / bats / jq / claude if relevant.
