name: Feature request
description: An idea for the harness.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing
      description: The problem or friction, not only the proposed feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd expect it to work — a registry line, a command, a check?
