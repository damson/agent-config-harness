name: Coverage

# Measures the bats suite's line coverage of the shell sources with kcov and
# uploads the result to Codecov, which owns the PR comment and the README
# badge. Informational only: statuses are configured non-blocking in
# codecov.yml, so it is deliberately NOT in the required-checks list.
#
# Push runs on develop upload the base coverage Codecov diffs PR runs
# against. A PR from a fork measures coverage but cannot upload it: GitHub
# does not grant id-token: write to a forked pull_request run, so there is no
# OIDC token to mint and no secret to fall back on. That run says so in its
# log rather than reporting a silent success.
permissions:
  contents: read
  id-token: write

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: coverage-${{ github.ref }}
  # A superseded PR run is waste, but a superseded develop push takes the base
  # upload with it and Codecov then has nothing to diff the next PR against.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # kcov instruments every bash child the suite spawns; slow is normal,
    # an hour is a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job runs PR-authored scripts under kcov; keep the token out
          # of the git config it can read.
          persist-credentials: false

      - name: Install bats and jq
        timeout-minutes: 5
        run: .github/install-packages.sh bats jq

      # Ubuntu 24.04 carries no kcov package; build a pinned release once and
      # let the cache make every later run a no-op.
      - name: Restore kcov from cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/kcov
          key: kcov-43-${{ runner.os }}-noble

      - name: Build kcov if the cache missed
        timeout-minutes: 10
        run: .github/install-kcov.sh

      - name: Make scripts executable
        run: chmod +x bin/*.sh evals/*.sh benchmarks/*.sh lib/*.sh

      - name: Run the suite under kcov
        run: |
          set -euo pipefail
          # --bash-parse-files-in-dir sweeps whole trees, so the data that
          # lives beside the scripts (score records, eval results, example
          # configs) gets counted as 0%-covered "code" unless excluded.
          "$HOME/.local/kcov/bin/kcov" \
               --include-path="$PWD/bin,$PWD/lib,$PWD/evals,$PWD/benchmarks" \
               --bash-parse-files-in-dir="$PWD/bin" \
               --bash-parse-files-in-dir="$PWD/lib" \
               --bash-parse-files-in-dir="$PWD/evals" \
               --bash-parse-files-in-dir="$PWD/benchmarks" \
               --exclude-pattern=/tests/,/benchmarks/scores/,/evals/results/,/evals/examples/ \
               coverage-out "$(command -v bats)" tests/
          echo "── kcov output tree ──"
          ls -la coverage-out
          # kcov names its result dir after the traced binary and only
          # sometimes leaves a kcov-merged. Merged is the whole run; a single
          # unmerged result is the whole run too, because there was only one.
          # Several unmerged results are per-child fragments, and uploading
          # the alphabetically first one (bash.<pid> sorts before kcov-merged)
          # would report one child's lines as the suite's. Fail instead.
          xml="coverage-out/kcov-merged/cobertura.xml"
          if [ ! -f "$xml" ]; then
            # No head: it would close the pipe and SIGPIPE find under pipefail.
            # No mapfile either, so this stays runnable on bash 3.2 and can be
            # tested off the runner. grep -c exits 1 on no matches, hence the
            # guard: an unguarded count would abort the step under set -e.
            found=$(find coverage-out -maxdepth 2 -name cobertura.xml | sort)
            count=$(printf '%s\n' "$found" | grep -c . || true)
            if [ "$count" -eq 1 ]; then
              xml="$found"
            else
              # Only say "fragment" when there are fragments; count 0 is the
              # produced-nothing case the next block reports properly. An
              # `[ ... ] && echo` one-liner here would exit the step under
              # set -e every time the test was false.
              if [ "$count" -gt 1 ]; then
                echo "::error::kcov left $count unmerged results; refusing to upload a fragment"
              fi
              xml=""
            fi
          fi
          if [ -z "$xml" ] || [ ! -f "$xml" ]; then
            echo "::error::kcov produced no cobertura.xml — tree follows"
            find coverage-out -maxdepth 3 | head -40
            exit 1
          fi
          echo "COBERTURA=$xml" >> "$GITHUB_ENV"
          echo "Uploading coverage from: $xml"

      # A forked pull_request run has no id-token permission, so use_oidc has
      # nothing to mint and the upload fails inside an action configured not
      # to fail the job. Skipping it visibly beats a green check that uploaded
      # nothing.
      - name: Say why a fork PR cannot upload
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Coverage measured but not uploaded: a fork PR cannot mint an OIDC token. A maintainer's run of the same commit uploads it."

      - name: Upload to Codecov
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ env.COBERTURA }}
          # Without this the uploader also auto-collects anything whose name
          # matches its search patterns (kcov's side JSONs, even a bats file
          # with "coverage" in its name) and reports them as coverage.
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
