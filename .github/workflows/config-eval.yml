name: Config Eval

# Runs this repository's own action (`uses: ./`) against this repository's own
# CLAUDE.md. The harness publishes a config-scoring action and, until this
# workflow existed, never ran it: every test of it stubs the Claude CLI, so the
# install step, the real API call and the job-summary rendering were proven
# only by reading them. A consumer would have been the first to execute that
# path for real.
#
# It runs on the pull requests where it can actually catch something: a change
# to the scored file, or a change to any part of the action that scores it.
# Scoring every pull request would spend API budget re-measuring a file the
# pull request did not touch.
#
# Path-filtered, so it must NOT become a required status check: GitHub holds a
# required check that never runs as pending forever, and that would block every
# pull request outside these paths.
#
# The gate is advisory in a second sense too: the grade comes from an LLM
# reading a file the pull request author controls. It catches drift, not
# adversaries. README says so under "Score your config in CI".

permissions:
  contents: read

on:
  pull_request:
    paths:
      # The file being scored.
      - 'CLAUDE.md'
      # Everything that decides how it is scored. A change here reaches the
      # rubric or the plumbing, and this workflow is the only end-to-end proof.
      - 'action.yml'
      - 'bin/eval-action.sh'
      - 'bin/install-claude-cli.sh'
      - 'evals/run-eval.sh'
      - 'evals/eval-schema.json'
      - 'evals/prompts/config-quality.md'
      - 'lib/scoring.sh'
      - 'lib/common.sh'
      - '.github/workflows/config-eval.yml'
  workflow_dispatch:

concurrency:
  group: config-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    name: Score CLAUDE.md
    runs-on: ubuntu-latest
    # An npm install plus one model call. Fifteen minutes is a hang, and a
    # hung job here would sit pending rather than fail readably.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The job reads the tree and calls an API; it never pushes.
          persist-credentials: false

      # Without the key the action exits 1 on its own, which would paint every
      # pull request in these paths red for a missing secret rather than for a
      # bad config. A fork's pull request never sees repository secrets, so
      # that state is normal, not an outage.
      #
      # The cost of skipping is a green check that scored nothing, which is the
      # failure mode a checks list hides best. The summary says so in as many
      # words, and it is the only thing this job writes when it skips.
      - name: Check the API key is present
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Config eval skipped: no ANTHROPIC_API_KEY available to this run. Nothing was scored."
            {
              echo "## Config eval: NOT RUN"
              echo
              echo "No \`ANTHROPIC_API_KEY\` was available to this run, so **CLAUDE.md was not scored**."
              echo "This check is green because nothing failed, not because anything passed."
              echo
              echo "A pull request from a fork cannot see repository secrets, and that is expected."
              echo "Otherwise: \`gh secret set ANTHROPIC_API_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # `uses: ./` runs the action as it exists in this pull request, not as it
      # exists at a released tag: the point is to prove the change, not the
      # release. An explicit `if:` replaces the implicit success() gate, so it
      # is spelled out here rather than assumed.
      - name: Score
        if: success() && steps.preflight.outputs.skipped != 'true'
        uses: ./
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          files: CLAUDE.md
          # C, not B. The eval moves plus or minus 1 to 2 on borderline scores,
          # so a tighter gate fails pull requests for non-determinism and
          # teaches everyone to re-run until green. This trips on a real
          # regression and stays quiet otherwise.
          fail-below: C
