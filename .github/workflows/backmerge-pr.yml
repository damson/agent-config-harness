name: Back-merge PR

# Opens a main → develop PR whenever main moves, so the two branches do not
# drift. Every release merge leaves a commit on main that develop never sees;
# the trees stay identical, so nothing looks wrong and the gap goes unnoticed
# until something asks whether develop is behind. Five releases had gone by
# before anyone did.
#
# It never merges — the same rule as the release PR. Merging into a protected
# branch stays a human decision. What this removes is having to remember.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: backmerge-pr
  cancel-in-progress: false

jobs:
  backmerge-pr:
    name: Open or refresh the back-merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the script counts commits across main..develop

      - name: Open or refresh
        run: ./bin/open-backmerge-pr.sh
        env:
          # A PR opened with GITHUB_TOKEN does not trigger other workflows, so
          # CI will not run on it. Acceptable for a routine back-merge, whose
          # trees are identical to develop's: there is nothing for CI to test.
          # It is NOT acceptable if main ever carries a hotfix: the PR body says
          # "Carries file changes" in that case, and that one wants a real run.
          # Swap in a PAT if hotfixes onto main become normal.
          #
          # More precisely: GitHub holds those runs in an APPROVAL-REQUIRED
          # state rather than declining them outright. A PR opened with
          # GITHUB_TOKEN produces pull_request runs that a user with write
          # access must approve before any job starts, which is what stops a
          # workflow triggering itself in a loop.
          #
          # What this looks like from the outside, because it has now been
          # misdiagnosed three times (see issue #26): each back-merge PR leaves
          # two runs in the Actions tab, CI and Coverage, against the PR's head
          # SHA, with `total_count: 0` jobs and `actor: github-actions[bot]`.
          # They read `action_required`, the awaiting-approval state, and
          # settle to `failure` once nothing approves them.
          #
          # Approving is not re-running, and only approving would help: a
          # re-run of a run that never started reproduces the same held state,
          # which is why these cannot be cleared by hitting re-run. Approval is
          # the merge-box "Approve workflows to run" button, or:
          #
          #   gh api -X POST repos/<owner>/<repo>/actions/runs/<id>/approve
          #
          # Routine back-merge runs are deliberately left UNAPPROVED. The head
          # SHA is already tested by main's own push run, so approving them
          # buys a second run of the identical tree. The exception is the case
          # the comment above names: if main ever carries a hotfix, the PR body
          # says "Carries file changes", and that one wants approving or a PAT.
          #
          # Two things keep the unapproved state harmless. A run with zero jobs
          # contributes no check runs, so nothing red appears on the PR itself;
          # and the green checks the PR does show come from main's push run on
          # the same SHA. Tell this apart from a real startup race or a merge
          # cancelling a run by reading the actor: a human-opened PR's runs are
          # not held, and execute normally.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
