name: CI

# CI only reads the checkout; never inherit repo-default write scopes.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# A newer push makes an in-flight run for the same ref pointless. Without this,
# a hung run also blocks the queue for its successor.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate scripts and run tests
    runs-on: ubuntu-latest
    # The whole job is ~30s of work. Ten minutes is a hang, not slowness — fail
    # so the PR shows red instead of sitting in_progress until the 6-hour cap.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI only reads the tree; keep the token out of the git config.
          persist-credentials: false

      - name: Install bats and jq
        timeout-minutes: 5
        run: .github/install-packages.sh bats jq

      - name: Make scripts executable
        run: chmod +x bin/*.sh evals/*.sh benchmarks/*.sh lib/*.sh

      - name: Syntax check all shell scripts
        run: |
          for f in bin/*.sh evals/*.sh benchmarks/*.sh lib/*.sh; do
            bash -n "$f"
          done

      - name: Run bats tests
        run: bats tests/

      - name: Run secret lint
        run: ./bin/lint-secrets.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # CI only reads the tree; keep the token out of the git config.
          persist-credentials: false

      - name: Install shellcheck
        timeout-minutes: 5
        run: .github/install-packages.sh shellcheck

      - name: Lint shell scripts
        run: |
          # .github/*.sh included: install-kcov.sh and install-packages.sh are
          # shell like any other, and were the only scripts in the repo that
          # nothing linted. They run on every coverage job.
          shellcheck -x -S warning -e SC1091 \
            bin/*.sh evals/*.sh benchmarks/*.sh lib/*.sh .github/*.sh
