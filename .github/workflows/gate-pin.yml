name: Gate pin

# Point the pull-request gate at the release that just happened.
#
# The gate scores a pull request with the RELEASED action rather than with the
# tree in front of it, because that job holds an API key and a pull request can
# edit the tree. The price is a second pin, and it went four releases stale
# without anything noticing: pull requests were graded by a rubric this repo no
# longer ships, so a check and a local `just eval` on the same file disagreed by
# construction and neither was comparable with the trend.
#
# It fires on the promotion, not on the tag. A push to main is the first moment
# the released commit exists, and it arrives a minute or two before
# `release: published` does, which matters only in that the pull request is
# waiting by the time anyone looks. Both are here because tagging by hand and
# promoting are separate acts, and either can happen without the other. The cron
# is a net for a release that somehow raised neither.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '37 8 * * MON'   # Mondays, a net rather than the trigger
  workflow_dispatch:

concurrency:
  group: gate-pin
  cancel-in-progress: false

jobs:
  bump:
    name: Follow the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A person's token: a pull request GitHub attributes to Actions raises no
      # `pull_request` runs, and this repo requires two of them, so such a pull
      # request is permanently unmergeable while reading as merely pending. That
      # lesson cost three hand-pushed commits on the benchmark PR.
      # Asking what the token may DO, not only whether it exists. A token that
      # can read and not write passes an emptiness check, and the job then runs
      # its whole suite before dying at `git push` on a bare 403 that names no
      # permission. That cost six runs and a wrong first hypothesis.
      - name: Check the publishing token can do what this job needs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set. This opens a pull request, and one opened by Actions never gets the checks this repo requires. The token needs Contents: read and write, Pull requests: read and write, and Workflows: read and write, because the commit it pushes changes a file under .github/workflows/."
            exit 1
          fi

          if ! login=$(gh api user --jq .login 2>&1); then
            echo "::error::RELEASE_PR_TOKEN does not authenticate: ${login}. It is expired, revoked, or not a token at all."
            exit 1
          fi

          # `permissions.push` is Contents: read and write under the name the
          # REST API uses for it.
          if ! writable=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push' 2>&1); then
            echo "::error::RELEASE_PR_TOKEN authenticates as ${login} but cannot read ${GITHUB_REPOSITORY}: ${writable}. Check the token's repository access."
            exit 1
          fi
          if [ "$writable" != "true" ]; then
            echo "::error::RELEASE_PR_TOKEN authenticates as ${login} but has no write access to ${GITHUB_REPOSITORY}. It needs Contents: read and write."
            exit 1
          fi

          # Workflows is the permission this job dies on, and only a classic
          # token publishes its scopes. A fine-grained one exposes nothing
          # comparable, so this cannot be asserted here: the push step names it
          # instead, which is why that step reports its own failure.
          scopes=$(gh api -i user 2>/dev/null | tr -d '\r' \
                   | awk -F': ' 'tolower($1) == "x-oauth-scopes" { print $2; exit }') || scopes=""
          if [ -n "$scopes" ]; then
            case ",${scopes// /}," in
              *,workflow,*) ;;
              *) echo "::error::RELEASE_PR_TOKEN is a classic token whose scopes (${scopes}) do not include 'workflow'. This job commits a file under .github/workflows/, which GitHub refuses without it."
                 exit 1 ;;
            esac
          fi

          echo "Token authenticates as ${login} with write access to ${GITHUB_REPOSITORY}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The bump lands on the integration branch, never on main.
          ref: develop
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Compare the gate's pin with the latest release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: ./bin/bump-gate-pin.sh

      - name: Install bats and jq
        if: success() && steps.bump.outputs.changed == 'true'
        timeout-minutes: 5
        run: .github/install-packages.sh bats jq

      # The workflow-shape tests are the ones that matter here: they assert the
      # gate never runs the tree it is scoring and that its ref is a full SHA,
      # which is exactly what a bad rewrite would break.
      - name: Run the suite against the rewritten workflow
        if: success() && steps.bump.outputs.changed == 'true'
        run: bats tests/

      - name: Open or refresh the pull request
        if: success() && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          CURRENT: ${{ steps.bump.outputs.current }}
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          set -euo pipefail
          branch="chore/gate-pin-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/config-eval.yml
          git commit -m "Grade pull requests with ${TAG}

          ${CURRENT} -> ${LATEST}

          Opened by the gate-pin workflow on the promotion of ${TAG}. The suite
          ran against the rewritten workflow before this was pushed."
          # Reporting its own failure, because the preflight has already proved
          # Contents: read and write, which leaves Workflows as the permission a
          # bare 403 here is about, and GitHub does not say so.
          if ! push_output=$(git push -u origin "$branch" --force 2>&1); then
            printf '%s\n' "$push_output"
            echo "::error::Pushing ${branch} failed. This commit changes .github/workflows/config-eval.yml, and the preflight already confirmed this token can write to the repository, so the permission left is Workflows: read and write on RELEASE_PR_TOKEN ('workflow' on a classic token)."
            exit 1
          fi
          existing=$(gh pr list --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
          body="\`${TAG}\` is out, so the gate should grade pull requests with it rather than with the release before.

          Pin: \`${CURRENT}\` to \`${LATEST}\`.

          The suite ran against the rewritten workflow before this was opened, including the checks that the gate never runs the tree it is scoring and that its ref stays a full SHA.

          Grades either side of this are not comparable when the release changed the rubric. That is the rubric change, not a regression in anyone's config."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base develop --head "$branch" \
              --title "Grade pull requests with ${TAG}" --body "$body"
          fi
